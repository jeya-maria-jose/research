<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 600 450" role="img" aria-labelledby="title description">
  <title id="title">HealthAgentBench</title>
  <desc id="description">Conceptual overview: healthcare environments spanning medical imaging, electronic health records and clinical trials. An AI agent acts with tools and is evaluated on task success.</desc>
  <metadata>Original schematic based on https://microsoft.github.io/HealthAgentBench/ and https://arxiv.org/pdf/2606.31179. Imaging includes X-ray report correction, pathology tumor area selection and CT abnormality classification. EHR includes data quality auditing, format conversion and event modelling. Clinical trials includes patient-to-trial matching. Icons are illustrative, not clinical data or benchmark results.</metadata>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#175cc3"/></marker>
  </defs>
  <rect width="600" height="450" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" transform="translate(0 -40)">
