      <path d="M468 165V130H476M502 165V130H494" fill="none"/>
      <rect x="476" y="120" width="18" height="34" rx="5" fill="#ffffff"/>
      <path d="M481 136H489M485 132V140M463 165H507" fill="none"/>
    </g>
    <g text-anchor="middle" font-size="25" font-weight="700" fill="#12284b">
      <text x="111" y="199">Imaging</text>
      <text x="300" y="199">EHR</text>
      <text x="489" y="199">Trials</text>
    </g>
